[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spins-sdp"
version = "0.1.0"
description = "Certification of Many-Body Properties Using NPA Hierarchy"
authors = [{name = "Francesco Flora", email = "fflora@icfo.net"}, {name = "Losel Matos", email = "sherab-losel.matos@polytechnique.edu"}]
requires-python = ">=3.10"
dependencies = [
    "cvxpy>=1.6",
    "mosek>=10.0",
    "numpy>=2.0",
    "scipy>=1.13",
    "qutip>=4.7",
    "physics-tenpy>=0.9",
    "tqdm>=4.60",
    "numpyencoder",
    "pillow>=9.0",
]

[project.optional-dependencies]
# Plotting / analysis helpers (used by plots.py and benchmarking notebooks)
plotting = ["matplotlib>=3.5", "pandas>=2.0"]

# Bayesian optimization with random forests
bayesian = ["scikit-learn>=1.0"]

# Restricted Boltzmann Machine sampler
rbm = ["jax>=0.4", "equinox>=0.11", "optax>=0.1"]

# HDF5-based results storage
hdf5 = ["h5py>=3.0"]

# Install all optional dependencies
all = ["scikit-learn>=1.0", "jax>=0.4", "equinox>=0.11", "optax>=0.1", "h5py>=3.0"]

# Development dependencies (for local development only)
dev = [
    "black>=23.0",
    "ipython>=8.0",
    "ipykernel>=6.0",
    "jupyterlab>=4.0",
    "matplotlib>=3.5",
    "pandas>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["spins_sdp*", "src*"]
